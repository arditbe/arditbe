<text x="340" y="80" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="900" fill="url(#neon)" filter="url(#sg)">Steve Jobs is the reason I build anything at all.</text>
<text x="340" y="128" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#dbe8ff">He taught me that the way a thing feels to use is not decoration</text>
<text x="340" y="158" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#dbe8ff">on top of the engineering — it is the engineering.</text>
<text x="340" y="188" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#dbe8ff"></text>
<text x="340" y="218" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#dbe8ff">That&#x27;s why I care about models running on the devices people already</text>
<text x="340" y="248" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#dbe8ff">have. A model nobody can run is not a finished piece of work.</text>
<g filter="url(#g)"><rect x="-280" y="-1.5" width="280" height="3" rx="1.5" fill="url(#tc)"><animateMotion dur="3.5s" begin="-0s" repeatCount="indefinite" rotate="auto" path="M-300 296 H1500"/></rect></g>
