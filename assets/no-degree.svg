<text x="600" y="96" text-anchor="middle" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="url(#neon)" filter="url(#sg)">I never got a CS degree. I pre-trained myself.</text>
<text x="600" y="146" text-anchor="middle" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-style="italic" font-weight="600" fill="#ffffff">“School doesn’t teach you. It fine-tunes what you already know.”</text>
<text x="170" y="194" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="16" fill="#6f9bff">degree.status<tspan fill="#ffffff"> = </tspan><tspan fill="#ff3df2">null</tspan></text>
<text x="170" y="218" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="16" fill="#6f9bff">education<tspan fill="#ffffff"> = </tspan><tspan fill="#00f0ff">computer science high school — that&#x27;s the whole of it</tspan></text>
<text x="170" y="242" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="16" fill="#6f9bff">teachers<tspan fill="#ffffff"> = </tspan><tspan fill="#00f0ff">documentation · source code · breaking things until they made sense</tspan></text>
<text x="170" y="266" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="16" fill="#6f9bff">4_years_saved<tspan fill="#ffffff"> = </tspan><tspan fill="#ffb800">spent shipping instead</tspan></text>
